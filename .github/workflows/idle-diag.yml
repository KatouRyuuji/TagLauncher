# 临时分支专用：收起抽屉 / 浮动窗合成线程唤醒二分（产品源码取各 SHA，测试 harness 统一取本分支）。
name: Idle diag

on:
  push:
    branches: [cursor/ux-walkthrough-redesign-8f3b]
  workflow_dispatch:

jobs:
  bisect:
    runs-on: windows-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: '76aa205', sha: '76aa205b9bde5870fb438aa15befa8fbffc7ab27', variant: '' }
          - { label: '4fdc124', sha: '4fdc124', variant: '' }
          - { label: '4fdc124-rev530-a', sha: '4fdc124', variant: 'rev530' }
          - { label: '4fdc124-rev530-b', sha: '4fdc124', variant: 'rev530' }
          - { label: '4fdc124-rev530-7bb-a', sha: '4fdc124', variant: 'rev530-7bb' }
          - { label: '4fdc124-rev530-7bb-b', sha: '4fdc124', variant: 'rev530-7bb' }
          - { label: '4fdc124-rev530-7bb-c', sha: '4fdc124', variant: 'rev530-7bb' }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Product source at SHA, harness from temp branch
        shell: bash
        run: |
          set -e
          cp -r e2e /tmp/e2e-harness
          git checkout -q ${{ matrix.sha }}
          rm -rf e2e && cp -r /tmp/e2e-harness e2e
          if [ "${{ matrix.variant }}" = "noscroll" ]; then
            sed -i 's/ scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent;//' src/quick/quick.css
            ! grep -n "scrollbar-width" src/quick/quick.css
          fi
          if [ "${{ matrix.variant }}" = "nomix" ]; then
            git show 98b4169 -- src/quick/quick.css | git apply -R
            grep -n "glass-bg-strong));" src/quick/quick.css
          fi
          if [ "${{ matrix.variant }}" = "rev530" ]; then
            git -c user.name=diag -c user.email=diag@local revert --no-commit 530150f
          fi
          if [ "${{ matrix.variant }}" = "rev530-7bb" ]; then
            git -c user.name=diag -c user.email=diag@local revert --no-commit 7bb7783 530150f
          fi
          git status --short
          git log --oneline -1
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r e2e/requirements-e2e.txt
      - name: Build release app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          node scripts/prepare-win11-menu.mjs
          node scripts/prepare-cli-bin.mjs
          npx tauri build --bundles nsis
          "TL_E2E_EXE=$((Get-Item src-tauri/target/release/tag-launcher.exe).FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Pin idle x2
        timeout-minutes: 40
        shell: pwsh
        env:
          CI: '1'
          TL_E2E_WEBVIEW2_HKLM_POLICY: '1'
          TL_E2E_ALLOW_REGISTRY: '1'
          TL_E2E_ALLOW_PHYSICAL: '1'
          TL_E2E_ALLOW_WINDOW: '1'
          TL_E2E_ALLOW_VISIBLE: '1'
          TL_E2E_DESKTOP: '1'
          TL_E2E_BUILD: release
          PYTHONIOENCODING: utf-8
        run: |
          foreach ($i in 1, 2) {
            $env:TL_E2E_RUN_DIR = "${{ github.workspace }}/.tmp-test/e2e/run-$i"
            python -m pytest -c e2e/pytest.ini e2e/tests/ui/test_pin.py::test_pin_resident_memory_and_idle_cpu --allow-physical-input --window-countdown 0 -q
          }
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bisect-${{ matrix.label }}
          path: .tmp-test/e2e/run-*/artifacts/test_pin_resident_memory_and_idle_cpu/pin-perf.json
