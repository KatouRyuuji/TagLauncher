name: Win11 menu probe

# 原型验证：未签名稀疏包 + IExplorerCommand。只在本分支/手动触发，不进 PR 必需检查。
on:
  workflow_dispatch:
  push:
    branches: ['cursor/win11-menu-*']
    paths: ['shell-ext/win11-menu/**', '.github/workflows/win11-menu-probe.yml']

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Probe (admin runner user)
        shell: pwsh
        run: ./shell-ext/win11-menu/probe.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win11-menu-${{ matrix.os }}
          path: ${{ runner.temp }}/win11menu/*.png
