# 面向用户的 E2E（真实 exe + WebView2 CDP）。独立、非必需（continue-on-error），不影响 ci.yml。
# CI 只跑 CLI / UI / 视觉三层：视觉层在 CI 只截图上传、不比基线；窗口层需要交互桌面，不在 CI 跑。
name: E2E

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ['main']

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    # 整套 305 例单机 ~80 分钟：按文件分 3 片并行，每片各自完整跑完并上传结果
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r e2e/requirements-e2e.txt

      - name: Build debug app (embedded frontend) + CLI
        run: |
          node scripts/prepare-cli-bin.mjs --placeholder
          npx tauri build --debug --no-bundle
          cargo build --manifest-path src-tauri/Cargo.toml --bin tl

      - name: Runner diagnostics (WebView2 / session)
        shell: pwsh
        run: |
          $keys = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
                  'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          foreach ($k in $keys) { if (Test-Path $k) { "WebView2 runtime ($k): $((Get-ItemProperty $k).pv)" } }
          "Session: $([Environment]::UserInteractive) user=$env:USERNAME elevated=$(([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))"
          foreach ($k in 'HKLM:\SOFTWARE\Policies\Microsoft\Edge', 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2', 'HKCU:\SOFTWARE\Policies\Microsoft\Edge\WebView2') {
            if (Test-Path $k) { "Policy ${k}"; Get-ItemProperty $k | Select-Object * -ExcludeProperty PS* | Format-List | Out-String -Width 200 } else { "Policy ${k}: (none)" }
          }
          Get-Item src-tauri/target/debug/tag-launcher.exe, src-tauri/target/debug/tl.exe | Format-Table Name, Length, LastWriteTime

      - name: Run E2E (cli + ui + visual)
        timeout-minutes: 45
        env:
          CI: '1'
          TL_E2E_RUN_DIR: ${{ github.workspace }}/.tmp-test/e2e/ci-run
          # runner 恒为提权：WebView2 150+ 丢弃 WEBVIEW2_* 环境变量，改由 HKLM 策略下发 CDP 端口
          TL_E2E_WEBVIEW2_HKLM_POLICY: '1'
        run: npm run test:e2e:ci -- --shard ${{ matrix.shard }}/3 --junitxml=.tmp-test/e2e/ci-run/junit.xml

      - name: E2E summary
        if: always()
        env:
          PYTHONIOENCODING: utf-8
        run: python e2e/tools/ci_summary.py .tmp-test/e2e/ci-run

      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.shard }}
          path: |
            .tmp-test/e2e/ci-run/results.json
            .tmp-test/e2e/ci-run/results.jsonl
            .tmp-test/e2e/ci-run/junit.xml
            .tmp-test/e2e/ci-run/report.html
            .tmp-test/e2e/ci-run/visual/
            .tmp-test/e2e/ci-run/artifacts/
          if-no-files-found: warn
