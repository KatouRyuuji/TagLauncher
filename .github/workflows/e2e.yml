# 面向用户的 E2E（真实 exe + WebView2 CDP）。独立、非必需（continue-on-error），不影响 ci.yml。
# e2e 作业跑 CLI / UI / 视觉三层（视觉层在 CI 只截图上传、不比基线）；desktop 作业在临时 runner 的交互桌面上跑 desktop + 窗口层。
name: E2E

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ['main']

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    # 整套 305 例单机 ~80 分钟：按文件分 3 片并行，每片各自完整跑完并上传结果
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r e2e/requirements-e2e.txt

      - name: Build debug app (embedded frontend) + CLI
        # 仍是 debug 构建（保留 debug_assertions 与测试钩子），但按发布版的优化级别编译：
        # 搜索已在 Rust，-O0 下的索引/SQLite 耗时不代表真实产品，性能用例测的应是优化后的代码
        env:
          CARGO_PROFILE_DEV_OPT_LEVEL: '3'
        run: |
          node scripts/prepare-cli-bin.mjs --placeholder
          node scripts/prepare-win11-menu.mjs --placeholder
          npx tauri build --debug --no-bundle
          cargo build --manifest-path src-tauri/Cargo.toml --bin tl

      - name: Runner diagnostics (WebView2 / session)
        shell: pwsh
        run: |
          $keys = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
                  'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          foreach ($k in $keys) { if (Test-Path $k) { "WebView2 runtime ($k): $((Get-ItemProperty $k).pv)" } }
          "Session: $([Environment]::UserInteractive) user=$env:USERNAME elevated=$(([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))"
          foreach ($k in 'HKLM:\SOFTWARE\Policies\Microsoft\Edge', 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2', 'HKCU:\SOFTWARE\Policies\Microsoft\Edge\WebView2') {
            if (Test-Path $k) { "Policy ${k}"; Get-ItemProperty $k | Select-Object * -ExcludeProperty PS* | Format-List | Out-String -Width 200 } else { "Policy ${k}: (none)" }
          }
          Get-Item src-tauri/target/debug/tag-launcher.exe, src-tauri/target/debug/tl.exe | Format-Table Name, Length, LastWriteTime

      - name: Run E2E (cli + ui + visual)
        timeout-minutes: 45
        env:
          CI: '1'
          TL_E2E_RUN_DIR: ${{ github.workspace }}/.tmp-test/e2e/ci-run
          # runner 恒为提权：WebView2 150+ 丢弃 WEBVIEW2_* 环境变量，改由 HKLM 策略下发 CDP 端口
          TL_E2E_WEBVIEW2_HKLM_POLICY: '1'
          # 临时 runner：允许右键菜单用例写 HKCU 再清理（本机默认不跑）
          TL_E2E_ALLOW_REGISTRY: '1'
        run: npm run test:e2e:ci -- --shard ${{ matrix.shard }}/3 --junitxml=.tmp-test/e2e/ci-run/junit.xml

      - name: E2E summary
        if: always()
        env:
          PYTHONIOENCODING: utf-8
        run: python e2e/tools/ci_summary.py .tmp-test/e2e/ci-run

      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.shard }}
          path: |
            .tmp-test/e2e/ci-run/results.json
            .tmp-test/e2e/ci-run/results.jsonl
            .tmp-test/e2e/ci-run/junit.xml
            .tmp-test/e2e/ci-run/report.html
            .tmp-test/e2e/ci-run/visual/
            .tmp-test/e2e/ci-run/artifacts/
          if-no-files-found: warn

  # 原「真机确认」项：右键菜单 / 发送到 / 前台 / 托盘 / 全局热键 / 全屏忽略 / 安装卸载 + 窗口层（真实 SendInput）。
  # 临时 runner 有交互桌面，且用完即弃：允许写 HKCU、接管鼠标键盘、窗口真实可见并抢前台。绝不在用户电脑上这样跑。
  desktop:
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r e2e/requirements-e2e.txt

      - name: Build debug app + NSIS installer + CLI
        env:
          CARGO_PROFILE_DEV_OPT_LEVEL: '3'
        shell: pwsh
        run: |
          # 任一构建命令失败即中止（pwsh 默认不因原生命令非零退出而停）
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          node scripts/prepare-cli-bin.mjs --placeholder
          node scripts/prepare-win11-menu.mjs
          npx tauri build --debug --bundles nsis --features gui-subsystem
          cargo build --manifest-path src-tauri/Cargo.toml --bin tl
          $nsis = Get-ChildItem src-tauri/target/debug/bundle/nsis/*-setup.exe | Select-Object -First 1
          "TL_E2E_NSIS=$($nsis.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Get-Item src-tauri/target/debug/tag-launcher.exe, src-tauri/target/debug/tl.exe, $nsis | Format-Table Name, Length

      - name: Desktop diagnostics (OS / session / notification area)
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          "OS: $($os.Caption) $($os.Version)  Session: $([Environment]::UserInteractive) user=$env:USERNAME"
          # runner 默认 1024×768：窗口层用例（拖边、Aero Snap、记住位置）按常见桌面尺寸编写，切到 1920×1080
          Add-Type -TypeDefinition @"
          using System; using System.Runtime.InteropServices;
          public static class Disp {
            [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
            public struct DEVMODE {
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;
              public short dmSpecVersion, dmDriverVersion, dmSize, dmDriverExtra; public int dmFields;
              public int dmPositionX, dmPositionY, dmDisplayOrientation, dmDisplayFixedOutput;
              public short dmColor, dmDuplex, dmYResolution, dmTTOption, dmCollate;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;
              public short dmLogPixels; public int dmBitsPerPel, dmPelsWidth, dmPelsHeight, dmDisplayFlags, dmDisplayFrequency;
              public int dmICMMethod, dmICMIntent, dmMediaType, dmDitherType, dmReserved1, dmReserved2, dmPanningWidth, dmPanningHeight;
            }
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern bool EnumDisplaySettings(string d, int m, ref DEVMODE dm);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern int ChangeDisplaySettings(ref DEVMODE dm, int f);
            public static int Set(int w, int h) {
              var dm = new DEVMODE(); dm.dmSize = (short)Marshal.SizeOf(typeof(DEVMODE));
              if (!EnumDisplaySettings(null, -1, ref dm)) return -100;
              dm.dmPelsWidth = w; dm.dmPelsHeight = h; dm.dmFields = 0x80000 | 0x100000;
              return ChangeDisplaySettings(ref dm, 1);
            }
          }
          "@
          "ChangeDisplaySettings(1920x1080) = $([Disp]::Set(1920, 1080))  (0 = 成功)"
          Start-Sleep -Seconds 2
          Get-CimInstance Win32_VideoController | ForEach-Object { "Display: $($_.Name) $($_.CurrentHorizontalResolution)x$($_.CurrentVerticalResolution)" }
          # 通知区图标不折叠进溢出区（Win10 系有效；Win11 系由用例按需处理）
          New-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer' -Name EnableAutoTray -Value 0 -PropertyType DWord -Force | Out-Null
          Get-Process explorer -ErrorAction SilentlyContinue | Format-Table Id, SessionId, StartTime

      - name: Run desktop E2E (desktop + window layers)
        timeout-minutes: 40
        env:
          CI: '1'
          TL_E2E_RUN_DIR: ${{ github.workspace }}/.tmp-test/e2e/desktop-run
          TL_E2E_WEBVIEW2_HKLM_POLICY: '1'
          TL_E2E_ALLOW_REGISTRY: '1'
          TL_E2E_ALLOW_PHYSICAL: '1'
          TL_E2E_ALLOW_WINDOW: '1'
          TL_E2E_ALLOW_VISIBLE: '1'
          TL_E2E_DESKTOP: '1'
          PYTHONIOENCODING: utf-8
        run: python -m pytest -c e2e/pytest.ini e2e/tests/desktop e2e/tests/window --allow-physical-input --window-countdown 0 -s --junitxml=.tmp-test/e2e/desktop-run/junit.xml

      - name: Desktop summary
        if: always()
        env:
          PYTHONIOENCODING: utf-8
        run: python e2e/tools/ci_summary.py .tmp-test/e2e/desktop-run

      - name: Upload desktop report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-desktop
          path: |
            .tmp-test/e2e/desktop-run/results.json
            .tmp-test/e2e/desktop-run/results.jsonl
            .tmp-test/e2e/desktop-run/junit.xml
            .tmp-test/e2e/desktop-run/report.html
            .tmp-test/e2e/desktop-run/artifacts/
          if-no-files-found: warn

  # 发布配置（release profile、windows 子系统、与发行包同一构建命令）下复测右键收纳与安装包：
  # 真实用户遇到的延迟以这里为准（desktop 作业是 debug + gui-subsystem）。
  desktop-release:
    runs-on: windows-latest
    timeout-minutes: 75
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r e2e/requirements-e2e.txt

      - name: Build release app + NSIS installer + CLI（同 release.yml）
        shell: pwsh
        run: |
          # 任一构建命令失败即中止（pwsh 默认不因原生命令非零退出而停）
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          node scripts/prepare-win11-menu.mjs
          node scripts/prepare-cli-bin.mjs
          npx tauri build --bundles nsis
          $nsis = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          "TL_E2E_NSIS=$($nsis.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "TL_E2E_EXE=$((Get-Item src-tauri/target/release/tag-launcher.exe).FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Get-Item src-tauri/target/release/tag-launcher.exe, $nsis | Format-Table Name, Length
          # PE 子系统：2 = GUI，3 = 控制台
          $b = [IO.File]::ReadAllBytes((Get-Item src-tauri/target/release/tag-launcher.exe).FullName)
          $pe = [BitConverter]::ToInt32($b, 0x3C)
          "PE subsystem = $([BitConverter]::ToUInt16($b, $pe + 0x5C))"

      - name: Run release shell + installer E2E
        # §3.3 指标口径是 Release 构建：快速窗唤出/查询/常驻内存（E-PERF-QUICK）与空闲 CPU（E-PERF-IDLE）也在这里跑一遍
        timeout-minutes: 45
        env:
          CI: '1'
          TL_E2E_RUN_DIR: ${{ github.workspace }}/.tmp-test/e2e/desktop-release-run
          TL_E2E_WEBVIEW2_HKLM_POLICY: '1'
          TL_E2E_ALLOW_REGISTRY: '1'
          TL_E2E_ALLOW_PHYSICAL: '1'
          TL_E2E_ALLOW_WINDOW: '1'
          TL_E2E_ALLOW_VISIBLE: '1'
          TL_E2E_DESKTOP: '1'
          TL_E2E_BUILD: release
          PYTHONIOENCODING: utf-8
        run: python -m pytest -c e2e/pytest.ini e2e/tests/desktop/test_desktop_shell.py e2e/tests/desktop/test_desktop_nsis.py e2e/tests/ui/test_quick.py::test_quick_window_performance e2e/tests/ui/test_quick.py::test_idle_cpu_with_both_windows_hidden --allow-physical-input --window-countdown 0 -s --junitxml=.tmp-test/e2e/desktop-release-run/junit.xml

      - name: Release summary
        if: always()
        env:
          PYTHONIOENCODING: utf-8
        run: python e2e/tools/ci_summary.py .tmp-test/e2e/desktop-release-run

      - name: Upload release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-desktop-release
          path: |
            .tmp-test/e2e/desktop-release-run/results.json
            .tmp-test/e2e/desktop-release-run/results.jsonl
            .tmp-test/e2e/desktop-release-run/junit.xml
            .tmp-test/e2e/desktop-release-run/report.html
            .tmp-test/e2e/desktop-release-run/artifacts/
          if-no-files-found: warn
