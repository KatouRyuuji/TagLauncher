[pytest]
testpaths = tests
addopts = -p no:cacheprovider -rA --tb=short --durations=20
# 单个用例超过 180s 时把各线程栈打到 stderr（不杀进程），定位卡点
faulthandler_timeout = 180
markers =
    case(*ids): 关联用例矩阵 ID
    physical_input: 接管真实鼠标/键盘，默认跳过
    visible_window: 窗口须出现在屏幕上，默认跳过
    real_registry: 写真实 HKCU 右键菜单键，只在 CI 跑
    expected_js_errors: 用例故意注入错误，JS 报错只记录不判失败
xfail_strict = false
