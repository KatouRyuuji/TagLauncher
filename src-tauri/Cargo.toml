[package]
name = "tag-launcher"
default-run = "tag-launcher"
version = "1.9.1-beta"
description = "标签式文件管理器"
authors = ["RyuuJi Soft"]
edition = "2021"

[lib]
name = "tag_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
# F18：用户启用后才注册的全局唤起热键（默认不注册，不抢任何键）；仅 Rust 侧调用，不向前端开放插件权限
tauri-plugin-global-shortcut = "2"
log = "0.4"
# 文件夹监视：notify 官方防抖层（经 re-export 使用 notify；Windows 底层为 ReadDirectoryChangesW）
notify-debouncer-full = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
# 主窗视图的名称排序：与前端 Intl.Collator("zh-CN", { numeric: true }) 同一 CLDR 规则
icu_collator = "2"
icu_locale_core = "2"
lofty = "0.24.0"
base64 = "0.22.1"
ureq = "2"
# tl CLI（src/bin/tl.rs）参数解析；GUI 不使用，但 cargo 依赖为包级共享。
clap = { version = "4", features = ["derive"] }
# tl tui 终端界面
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
# 集成测试（tests/）需直接用 rusqlite 播种旧版本 schema 并做原始 SQL 断言。
# 与主依赖同版本，Cargo 统一为同一实例（不重复编译 sqlite）；仅暴露给测试，不入库产物。
rusqlite = { version = "0.31", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
# 资源管理器右键菜单（HKCU 动词）与「发送到」快捷方式（阶段③）
winreg = "0.56"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
# 用于按 NTFS 文件ID重定位对象当前路径（OpenFileById / GetFinalPathNameByHandleW），
# 用关联程序打开对象（ShellExecuteW，替代经 cmd.exe 的启动，杜绝命令注入），
# 以及视频等内容的系统缩略图提取（IShellItemImageFactory + GDI+ 落盘 PNG）。
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_System_Com"] }

# 发布构建优化：LTO + 单代码生成单元提升运行性能，strip 移除调试符号显著减小二进制体积。
# 不启用 panic="abort"：连接层依赖 Mutex 锁中毒恢复（panic 展开），abort 会改变该容错行为。
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
